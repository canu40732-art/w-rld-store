<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WØRLD — Tarzını Taşı</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

header {
  background: #050505;
  color: white;
  padding: 18px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 4px;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: white;
  text-decoration: none;
  cursor: pointer;
}

.cart-button {
  background: white;
  color: black;
  border: none;
  padding: 10px 16px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
}

.hero {
  min-height: 430px;
  background: linear-gradient(135deg, #000, #222);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 20px;
}

.hero h1 {
  font-size: clamp(55px, 12vw, 120px);
  letter-spacing: 12px;
}

.hero p {
  font-size: 18px;
  margin: 15px 0 25px;
  color: #ccc;
}

.hero button {
  padding: 14px 28px;
  border: none;
  border-radius: 30px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 50px 20px;
}

.section-title {
  font-size: 32px;
  margin-bottom: 25px;
}

.categories {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.categories button {
  padding: 10px 18px;
  border: 1px solid #111;
  background: white;
  border-radius: 20px;
  cursor: pointer;
}

.categories button:hover {
  background: #111;
  color: white;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 25px;
  font-size: 16px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
}

.product {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
  transition: .2s;
}

.product:hover {
  transform: translateY(-5px);
}

.product-image {
  height: 250px;
  background: linear-gradient(135deg, #ddd, #999);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: 900;
  color: white;
  letter-spacing: 3px;
}

.product-info {
  padding: 18px;
}

.product-info h3 {
  margin-bottom: 8px;
}

.price {
  font-weight: bold;
  font-size: 20px;
  margin-bottom: 15px;
}

.add {
  width: 100%;
  padding: 12px;
  border: none;
  background: #111;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.cart {
  position: fixed;
  right: -420px;
  top: 0;
  width: min(400px, 90%);
  height: 100vh;
  background: white;
  z-index: 20;
  padding: 25px;
  box-shadow: -5px 0 25px rgba(0,0,0,.2);
  transition: .3s;
  overflow-y: auto;
}

.cart.open {
  right: 0;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 25px;
}

.close {
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
}

.cart-item {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.cart-item button {
  margin-top: 8px;
  border: none;
  background: #eee;
  padding: 6px 10px;
  cursor: pointer;
}

.total {
  font-size: 22px;
  font-weight: bold;
  margin: 25px 0;
}

.checkout {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

footer {
  background: #050505;
  color: #aaa;
  text-align: center;
  padding: 35px;
  margin-top: 30px;
}

@media (max-width: 600px) {
  nav {
    display: none;
  }

  header {
    padding: 15px 20px;
  }

  .hero {
    min-height: 360px;
  }

  .hero h1 {
    letter-spacing: 6px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">WØRLD</div>

  <nav>
    <a onclick="goProducts()">Ürünler</a>
    <a onclick="filterProducts('Tişört')">Tişört</a>
    <a onclick="filterProducts('Cüzdan')">Cüzdan</a>
    <a onclick="filterProducts('Aksesuar')">Aksesuar</a>
  </nav>

  <button class="cart-button" onclick="toggleCart()">
    🛒 Sepet (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <div>
    <h1>WØRLD</h1>
    <p>Tarzını dünyaya taşı.</p>
    <button onclick="goProducts()">ALIŞVERİŞE BAŞLA</button>
  </div>
</section>

<main class="container" id="productsSection">

  <h2 class="section-title">Ürünler</h2>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Ürün ara..."
    oninput="searchProducts()"
  >

  <div class="categories">
    <button onclick="filterProducts('Tümü')">Tümü</button>
    <button onclick="filterProducts('Tişört')">Tişört</button>
    <button onclick="filterProducts('Cüzdan')">Cüzdan</button>
    <button onclick="filterProducts('Aksesuar')">Aksesuar</button>
  </div>

  <div class="products" id="products"></div>

</main>

<div class="cart" id="cart">

  <div class="cart-header">
    <h2>Sepetim</h2>
    <button class="close" onclick="toggleCart()">×</button>
  </div>

  <div id="cartItems"></div>

  <div class="total">
    Toplam: <span id="total">0</span> TL
  </div>

  <button class="checkout" onclick="checkout()">
    SİPARİŞ VER
  </button>

</div>

<footer>
  <div class="logo">WØRLD</div>
  <p style="margin-top:10px;">Tarzını dünyaya taşı.</p>
  <p style="margin-top:15px;">© 2026 WØRLD</p>
</footer>

<script>

const products = [
  {
    id: 1,
    name: "WØRLD Oversize Tişört",
    category: "Tişört",
    price: 499,
    icon: "👕"
  },
  {
    id: 2,
    name: "WØRLD Classic Tişört",
    category: "Tişört",
    price: 399,
    icon: "👕"
  },
  {
    id: 3,
    name: "WØRLD Classic Cüzdan",
    category: "Cüzdan",
    price: 349,
    icon: "👛"
  },
  {
    id: 4,
    name: "WØRLD Premium Cüzdan",
    category: "Cüzdan",
    price: 499,
    icon: "👛"
  },
  {
    id: 5,
    name: "WØRLD Cap",
    category: "Aksesuar",
    price: 299,
    icon: "🧢"
  },
  {
    id: 6,
    name: "WØRLD Mini Bag",
    category: "Aksesuar",
    price: 599,
    icon: "👜"
  }
];

let cart = [];
let currentCategory = "Tümü";

function displayProducts(list = products) {

  const area = document.getElementById("products");

  area.innerHTML = "";

  if (list.length === 0) {
    area.innerHTML = "<p>Ürün bulunamadı.</p>";
    return;
  }

  list.forEach(product => {

    area.innerHTML += `
      <div class="product">

        <div class="product-image">
          ${product.icon}
        </div>

        <div class="product-info">

          <h3>${product.name}</h3>

          <p style="color:#777;margin-bottom:10px;">
            ${product.category}
          </p>

          <div class="price">
            ${product.price} TL
          </div>

          <button class="add" onclick="addToCart(${product.id})">
            SEPETE EKLE
          </button>

        </div>

      </div>
    `;
  });
}

function addToCart(id) {

  const product = products.find(p => p.id === id);

  cart.push(product);

  updateCart();

  document.getElementById("cart").classList.add("open");
}

function updateCart() {

  document.getElementById("cartCount").textContent = cart.length;

  const area = document.getElementById("cartItems");

  area.innerHTML = "";

  let total = 0;

  cart.forEach((product, index) => {

    total += product.price;

    area.innerHTML += `
      <div class="cart-item">

        <strong>${product.name}</strong>

        <p>${product.price} TL</p>

        <button onclick="removeFromCart(${index})">
          Sepetten çıkar
        </button>

      </div>
    `;
  });

  document.getElementById("total").textContent = total;
}

function removeFromCart(index) {

  cart.splice(index, 1);

  updateCart();
}

function toggleCart() {

  document.getElementById("cart").classList.toggle("open");
}

function filterProducts(category) {

  currentCategory = category;

  if (category === "Tümü") {
    displayProducts(products);
  } else {
    displayProducts(
      products.filter(p => p.category === category)
    );
  }

  document.getElementById("productsSection")
    .scrollIntoView({behavior:"smooth"});
}

function searchProducts() {

  const text =
    document.getElementById("search").value.toLowerCase();

  let result = products.filter(p =>
    p.name.toLowerCase().includes(text)
  );

  if (currentCategory !== "Tümü") {
    result = result.filter(
      p => p.category === currentCategory
    );
  }

  displayProducts(result);
}

function goProducts() {

  document.getElementById("productsSection")
    .scrollIntoView({behavior:"smooth"});
}

function checkout() {

  if (cart.length === 0) {
    alert("Sepetiniz boş!");
    return;
  }

  alert(
    "Siparişiniz alındı! 🎉\n\n" +
    "Bu demo sitedir; gerçek ödeme sistemi bağlı değildir."
  );
}

displayProducts();

</script>

</body>
</html>
