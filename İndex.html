<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WØRLD Mağaza</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

header {
  background: #050505;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 26px;
  font-weight: bold;
}

.cart {
  background: white;
  color: black;
  border: none;
  padding: 10px 16px;
  border-radius: 25px;
  font-weight: bold;
}

.hero {
  background: linear-gradient(135deg, #111, #444);
  color: white;
  text-align: center;
  padding: 80px 20px;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  color: #ddd;
  margin-bottom: 25px;
  font-size: 18px;
}

.hero button {
  padding: 14px 28px;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 50px 20px;
}

h2 {
  margin-bottom: 25px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.product-image {
  height: 180px;
  background: #eee;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  margin-bottom: 15px;
}

.product h3 {
  margin-bottom: 8px;
}

.price {
  font-weight: bold;
  margin: 12px 0;
}

.product button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #111;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

footer {
  background: #050505;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">WØRLD</div>
  <button class="cart" onclick="showCart()">
    🛒 Sepet (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>WØRLD</h1>
  <p>Tarzını taşı.</p>
  <button onclick="goProducts()">Ürünleri Gör</button>
</section>

<div class="container" id="productsSection">

  <h2>Ürünler</h2>

  <div class="products">

    <div class="product">
      <div class="product-image">👕</div>
      <h3>WØRLD T-Shirt</h3>
      <p>Premium günlük tişört.</p>
      <div class="price">499 TL</div>
      <button onclick="addToCart('WØRLD T-Shirt',499)">
        Sepete Ekle
      </button>
    </div>

    <div class="product">
      <div class="product-image">👟</div>
      <h3>WØRLD Sneaker</h3>
      <p>Modern ve rahat sneaker.</p>
      <div class="price">1.499 TL</div>
      <button onclick="addToCart('WØRLD Sneaker',1499)">
        Sepete Ekle
      </button>
    </div>

    <div class="product">
      <div class="product-image">🧢</div>
      <h3>WØRLD Cap</h3>
      <p>Günlük kullanım için şık şapka.</p>
      <div class="price">299 TL</div>
      <button onclick="addToCart('WØRLD Cap',299)">
        Sepete Ekle
      </button>
    </div>

    <div class="product">
      <div class="product-image">🎒</div>
      <h3>WØRLD Bag</h3>
      <p>Geniş ve kullanışlı çanta.</p>
      <div class="price">799 TL</div>
      <button onclick="addToCart('WØRLD Bag',799)">
        Sepete Ekle
      </button>
    </div>

  </div>
</div>

<footer>
  © 2026 WØRLD — Tüm hakları saklıdır.
</footer>

<script>

let cart = [];

function addToCart(name, price) {
  cart.push({
    name: name,
    price: price
  });

  document.getElementById("cartCount").textContent = cart.length;

  alert(name + " sepete eklendi! 🛒");
}

function showCart() {

  if (cart.length === 0) {
    alert("Sepetiniz boş!");
    return;
  }

  let total = 0;
  let text = "SEPETİNİZ:\n\n";

  cart.forEach(function(item) {
    text += item.name + " - " + item.price + " TL\n";
    total += item.price;
  });

  text += "\nToplam: " + total + " TL";

  alert(text);
}

function goProducts() {
  document.getElementById("productsSection").scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
